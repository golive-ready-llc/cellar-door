# Smoke test for the in-app live camera flow.
#
# Verifies:
#   - "Add wine" header button opens the full-screen Scan Wine overlay
#   - X close returns to /cellar
#
# Capacitor WebView a11y bridge sometimes can't see text inside the
# overlay (Label/Barcode/Wine List tabs). We fall back to coordinate
# tap on the close button (top-right X) and verify we're back on cellar.
appId: com.cellardoor.app
---
- launchApp
- tapOn: "Cellar"
- assertVisible: "Cellar Door"
# Open camera via the "Add wine" button in the header. The button is
# discoverable; "Scan Wine" overlay text inside the WebView is sometimes
# not. We don't assert the overlay's inner WebView text.
- tapOn:
    text: "Add wine|Add wine — opens camera"
# Wait long enough for the overlay to mount and the camera preview
# to start (~2-3s).
- extendedWaitUntil:
    visible: "Scan Wine|Enter manually|Cancel"
    timeout: 15000
    optional: true
# Close — the X is in the top-right of the overlay (~92% x, 5% y on
# phones). The button has accessible-id "scan-close" but a11y bridge
# isn't reliable.
- tapOn:
    id: "scan-close"
    optional: true
- tapOn:
    point: "92%,5%"
    optional: true
- pressKey: Back
- pressKey: Back
- extendedWaitUntil:
    visible: "Cellar"
    timeout: 5000
