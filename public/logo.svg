<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#1c1917"/>
  <circle cx="256" cy="256" r="238" fill="#292524" stroke="#78350f" stroke-width="3"/>
  <!-- Arched cellar door -->
  <path d="M152 440 L152 220 A104 104 0 0 1 360 220 L360 440 Z" fill="url(#door)" stroke="#92400e" stroke-width="4"/>
  <!-- Door arch highlight -->
  <path d="M168 440 L168 228 A88 88 0 0 1 344 228 L344 440 Z" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.5"/>
  <!-- Door center line -->
  <line x1="256" y1="180" x2="256" y2="440" stroke="#92400e" stroke-width="3"/>
  <!-- Door panels - left -->
  <rect x="172" y="260" width="68" height="80" rx="4" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.6"/>
  <rect x="172" y="355" width="68" height="70" rx="4" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.6"/>
  <!-- Door panels - right -->
  <rect x="272" y="260" width="68" height="80" rx="4" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.6"/>
  <rect x="272" y="355" width="68" height="70" rx="4" fill="none" stroke="#a16207" stroke-width="1.5" opacity="0.6"/>
  <!-- Door handles -->
  <circle cx="244" cy="330" r="6" fill="#d97706"/>
  <circle cx="268" cy="330" r="6" fill="#d97706"/>
  <!-- Wine glass silhouette above door -->
  <g transform="translate(256, 145)">
    <!-- Glass bowl -->
    <ellipse cx="0" cy="-20" rx="28" ry="24" fill="url(#wine)" opacity="0.9"/>
    <!-- Wine level -->
    <ellipse cx="0" cy="-14" rx="22" ry="12" fill="#7f1d1d" opacity="0.5"/>
    <!-- Stem -->
    <rect x="-3" y="2" width="6" height="24" rx="3" fill="#d4d4d8"/>
    <!-- Base -->
    <ellipse cx="0" cy="28" rx="16" ry="4" fill="#d4d4d8"/>
    <!-- Glass rim highlight -->
    <ellipse cx="0" cy="-42" rx="20" ry="3" fill="none" stroke="#fafaf9" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#78350f" stroke-width="1" opacity="0.4"/>
</svg>
