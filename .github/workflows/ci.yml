name: CI
on:
  pull_request:
    branches: [master]
jobs:
  quality:
    # Self-hosted (containerstore) — org Actions spending limit is $0
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
